services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: echobook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - echobook-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echobook"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: 8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=echobook;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    volumes:
      - echobook-uploads:/app/Uploads
      - echobook-audio-cache:/app/AudioCache

volumes:
  echobook-db-data:
  echobook-uploads:
  echobook-audio-cache:
